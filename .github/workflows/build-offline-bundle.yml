name: Build offline XFCE bundle

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Arch packages
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring pacman-contrib
          mkdir -p offline-bundle/packages
          pacman -Sw --noconfirm --cachedir offline-bundle/packages \
            base linux linux-firmware sudo networkmanager \
            grub efibootmgr dosfstools e2fsprogs \
            xfce4 xfce4-goodies lightdm lightdm-gtk-greeter \
            xfce4-pulseaudio-plugin network-manager-applet \
            pipewire pipewire-audio pipewire-pulse pipewire-alsa wireplumber \
            pavucontrol bluez bluez-utils blueman upower \
            gvfs gvfs-mtp firefox xorg-server xorg-xinit \
            noto-fonts noto-fonts-cjk noto-fonts-emoji \
            ttf-jetbrains-mono-nerd fontconfig
          repo-add offline-bundle/packages/offline.db.tar.gz \
            offline-bundle/packages/*.pkg.tar.zst
          cp offline-arch.sh README.md offline-bundle/
          printf '%s\n' "Generated by GitHub Actions" > offline-bundle/README.txt

      - name: Upload USB bundle
        uses: actions/upload-artifact@v4
        with:
          name: arch-xfce-offline-bundle
          path: offline-bundle/
          if-no-files-found: error
