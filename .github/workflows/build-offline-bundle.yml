name: Build offline XFCE bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Arch packages
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring github-cli curl
          ARCHIVE_DATE=2026/11/01 ./offline-arch.sh prepare offline-bundle
          tar -C offline-bundle -czf arch-xfce-offline-bundle.tar.gz .

      - name: Upload USB bundle
        uses: actions/upload-artifact@v4
        with:
          name: arch-xfce-offline-bundle
          path: arch-xfce-offline-bundle.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="offline-xfce-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            arch-xfce-offline-bundle.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Offline XFCE Bundle #${GITHUB_RUN_NUMBER}" \
            --notes "Arch Linux + XFCE offline package bundle."
